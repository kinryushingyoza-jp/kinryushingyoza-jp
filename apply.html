<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>無料サンプル申込｜金龍神餃子</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '2419677635181694');
    fbq('track', 'PageView');
  </script>
  <style>
    :root{--black:#151515;--dark:#171717;--panel:#222222;--card:#2A2A2A;--gold:#C89B2B;--cream:#F3EBDD;--text:#D0D0D0;--line:rgba(200,155,43,.34)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(200,155,43,.16),transparent 34%),linear-gradient(180deg,#171717,#151515);color:var(--text);font-family:"Noto Sans JP","Yu Gothic",sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .header{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 min(28px,5vw);border-bottom:1px solid var(--line);background:rgba(21,21,21,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}
    .brand{display:flex;align-items:center;gap:12px;color:var(--cream);font-family:"Yu Mincho","Noto Serif JP",serif;font-weight:800;letter-spacing:.08em}
    .brand img{width:42px;height:42px;border-radius:50%;object-fit:cover}
    .back{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;border:1px solid rgba(200,155,43,.42);color:var(--cream);font-size:13px;font-weight:700}
    .wrap{width:min(860px,calc(100% - 32px));margin:0 auto;padding:56px 0 76px}
    .intro{text-align:center;margin-bottom:30px}
    .eyebrow{margin:0 0 12px;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.22em}
    h1{margin:0;color:var(--cream);font-family:"Yu Mincho","Noto Serif JP",serif;font-size:clamp(30px,7vw,46px);line-height:1.45;letter-spacing:.04em}
    .lead{max-width:680px;margin:18px auto 0;color:var(--text)}
    .notice{margin:28px auto 28px;padding:20px 22px;border:1px solid var(--line);border-radius:18px;background:#2A2A2A;color:var(--cream);box-shadow:0 16px 42px rgba(0,0,0,.22);line-height:1.9}
    .form-card{padding:30px;border:1px solid var(--line);border-radius:22px;background:#222222;box-shadow:0 22px 64px rgba(0,0,0,.32)}
    form{display:grid;gap:18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    label{display:grid;gap:8px;color:var(--cream);font-weight:700;font-size:14px}
    .required{color:var(--gold);font-size:12px;margin-left:4px}
    input,select,textarea{width:100%;min-height:52px;padding:13px 14px;border:1px solid rgba(200,155,43,.28);border-radius:12px;background:#171717;color:#F3EBDD;font:inherit;outline:none}
    textarea{min-height:128px;resize:vertical}
    input::placeholder,textarea::placeholder{color:#8d8d8d}
    input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,155,43,.16)}
    .full{grid-column:1/-1}
    .honeypot{position:absolute;left:-9999px;opacity:0}
    .submit{width:100%;min-height:62px;border:1px solid var(--gold);border-radius:0;background:#C89B2B;color:#151515;font-weight:900;font-size:16px;letter-spacing:.04em;cursor:pointer;transition:.2s}
    .submit:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .submit[disabled]{opacity:.62;cursor:not-allowed;transform:none}
    .fine{margin:0;color:#aaa;font-size:12px;line-height:1.75}
    .status{display:none;margin:0;padding:13px 14px;border-radius:12px;font-size:14px}
    .status.error{display:block;border:1px solid rgba(255,120,120,.35);background:rgba(90,20,20,.3);color:#ffd7d7}
    .status.info{display:block;border:1px solid rgba(200,155,43,.35);background:rgba(200,155,43,.1);color:var(--cream)}
    @media(max-width:640px){.header{height:64px;padding:0 14px}.brand{font-size:15px}.brand img{width:38px;height:38px}.back{font-size:12px;padding:0 10px}.wrap{width:calc(100% - 24px);padding:36px 0 56px}.form-card{padding:22px 16px;border-radius:18px}.grid{grid-template-columns:1fr;gap:16px}input,select,textarea{font-size:16px}.submit{min-height:58px}}
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html" aria-label="金龍神餃子 トップページへ"><img src="assets/kinryujin-logo.jpg" alt="金龍神餃子 ロゴ"><span>金龍神餃子</span></a>
    <a class="back" href="index.html">ページに戻る</a>
  </header>
  <main class="wrap">
    <section class="intro">
      <p class="eyebrow">FREE SAMPLE APPLICATION</p>
      <h1>無料サンプル申込み</h1>
      <p class="lead">飲食店・事業者様向けの無料サンプル申込フォームです。必要事項をご入力ください。</p>
    </section>
    <p class="notice">
      <strong>サンプル30個の商品代金は無料です。</strong><br>
      配送はヤマト運輸の冷凍便・着払いとなります。<br>
      送料はお届け地域によって異なります。<br>
      初回の正式なご注文分は送料無料です。
    </p>
    <section class="form-card" aria-label="無料サンプル申込フォーム">
      <form id="sample-form" action="https://formspree.io/f/REPLACE_WITH_FORM_ID" method="POST">
        <input type="hidden" name="_subject" value="金龍神餃子 無料サンプル申込み">
        <input type="text" name="_gotcha" class="honeypot" tabindex="-1" autocomplete="off">
        <div class="grid">
          <label>店舗名・会社名 <span class="required">必須</span><input name="店舗名・会社名" required autocomplete="organization" placeholder="例：金龍神ラーメン"></label>
          <label>ご担当者名 <span class="required">必須</span><input name="ご担当者名" required autocomplete="name" placeholder="例：山田 太郎"></label>
          <label>電話番号 <span class="required">必須</span><input name="電話番号" required type="tel" autocomplete="tel" placeholder="例：090-0000-0000"></label>
          <label>メールアドレス <span class="required">必須</span><input name="email" required type="email" autocomplete="email" placeholder="例：sample@example.com"></label>
          <label>業態 <select name="業態"><option value="">選択してください</option><option>ラーメン店</option><option>居酒屋</option><option>中華料理店</option><option>定食・食堂</option><option>キッチンカー</option><option>その他飲食店</option></select></label>
          <label>郵便番号 <input name="郵便番号" autocomplete="postal-code" placeholder="例：123-4567"></label>
          <label class="full">配送先住所 <span class="required">必須</span><input name="配送先住所" required autocomplete="street-address" placeholder="都道府県・市区町村・番地・建物名"></label>
          <label class="full">備考 <textarea name="備考" placeholder="ご希望やご質問があればご記入ください。"></textarea></label>
        </div>
        <p class="fine">※主落地页、申请页均不会公开显示メールアドレスやGoogleアカウント情報。送信内容はサンプル対応の目的でのみ確認します。</p>
        <p class="status" id="form-status" role="status" aria-live="polite"></p>
        <button class="submit" type="submit">無料サンプルを申し込む</button>
      </form>
    </section>
  </main>
  <script>
    const form = document.getElementById('sample-form');
    const statusEl = document.getElementById('form-status');
    const submitButton = form.querySelector('button[type="submit"]');
    let formStarted = false;
    form.addEventListener('input', () => {
      if (!formStarted) {
        formStarted = true;
        if (typeof fbq === 'function') fbq('trackCustom', 'sample_form_start');
      }
    }, { once: true });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const endpoint = form.getAttribute('action');
      if (endpoint.includes('REPLACE_WITH_FORM_ID')) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Formspreeの送信先が未設定です。管理者にお問い合わせください。';
        return;
      }
      submitButton.disabled = true;
      statusEl.className = 'status info';
      statusEl.textContent = '送信しています。しばらくお待ちください。';
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (!response.ok) throw new Error('submit failed');
        sessionStorage.setItem('sampleFormSubmitted', '1');
        window.location.href = 'thankyou.html';
      } catch (error) {
        submitButton.disabled = false;
        statusEl.className = 'status error';
        statusEl.textContent = '送信できませんでした。時間をおいて再度お試しください。';
      }
    });
  </script>
</body>
</html>
